name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  JENKINS_URL: http://localhost:8080
  JENKINS_JOB: jenkins-pipeline-verify

jobs:
  build-and-test:
    name: Build & test sample-app (Maven)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: sample-app/pom.xml

      - name: mvn verify (compile, unit tests, checkstyle, package)
        working-directory: sample-app
        run: |
          ./mvnw -B -ntp clean verify checkstyle:check

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: sample-app/target/surefire-reports/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload built jar
        uses: actions/upload-artifact@v4
        with:
          name: sample-app-jar
          path: sample-app/target/sample-app.jar
          if-no-files-found: error
          retention-days: 14

  verify-jenkinsfile:
    name: Verify Jenkinsfile against a real Jenkins controller
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # A shallow clone (the actions/checkout default) makes this repo
          # a "shallow" git repository. Fetching from it locally then fails
          # with "shallow roots are not allowed to be updated" once the git
          # plugin tries to populate refs/remotes/origin/main in the job's
          # workspace. A full clone avoids that entirely.
          fetch-depth: 0

      - name: Make the checkout writable by the container's jenkins user (uid 1000)
        run: chmod -R a+rwX "${GITHUB_WORKSPACE}"

      - name: Start Jenkins (setup wizard disabled - ephemeral, CI-only instance)
        run: |
          docker run -d --name jenkins \
            -p 8080:8080 \
            -e JAVA_OPTS="-Djenkins.install.runSetupWizard=false -Dhudson.plugins.git.GitSCM.ALLOW_LOCAL_CHECKOUT=true" \
            -v "${GITHUB_WORKSPACE}":/repo \
            jenkins/jenkins:lts

          echo "Waiting for Jenkins to come up..."
          timeout 180 bash -c "until curl -sf ${JENKINS_URL}/login >/dev/null; do sleep 3; done"

      - name: Install the plugins this pipeline needs, then restart
        run: |
          docker exec jenkins jenkins-plugin-cli --plugin-file /repo/plugins.txt

          docker restart jenkins
          echo "Waiting for Jenkins to come back up after the plugin restart..."
          timeout 180 bash -c "until curl -sf ${JENKINS_URL}/login >/dev/null; do sleep 3; done"
          # Give plugin initialization a moment to finish past the point the
          # HTTP port starts answering.
          sleep 10

      - name: Allow the local file:// checkout of this repo
        run: |
          # Modern git disables the file:// transport by default (CVE-2022-39253).
          # This is a same-machine checkout of the repo under test, not an
          # untrusted remote, so it's safe to allow here.
          # Wildcard is fine here: this is a throwaway, single-purpose
          # container that only ever touches the one repo bind-mounted
          # into it, torn down at the end of this CI job.
          docker exec jenkins git config --global --add safe.directory '*'
          docker exec jenkins git config --global protocol.file.allow always

      - name: Create the pipeline job via the Jenkins REST API
        run: |
          # The default crumb issuer binds a crumb to the session that
          # requested it, so the crumb-fetch and the POST that uses it must
          # share a cookie jar - otherwise Jenkins rejects it as invalid.
          CRUMB_JSON=$(curl -sf -c cookies.txt "${JENKINS_URL}/crumbIssuer/api/json")
          CRUMB_FIELD=$(echo "$CRUMB_JSON" | jq -r '.crumbRequestField')
          CRUMB_VALUE=$(echo "$CRUMB_JSON" | jq -r '.crumb')

          cat > job-config.xml <<'EOF'
          <?xml version='1.0' encoding='UTF-8'?>
          <flow-definition plugin="workflow-job">
            <description>Runs this repository's Jenkinsfile against the real sample-app sources.</description>
            <keepDependencies>false</keepDependencies>
            <properties/>
            <definition class="org.jenkinsci.plugins.workflow.cps.CpsScmFlowDefinition" plugin="workflow-cps">
              <scm class="hudson.plugins.git.GitSCM" plugin="git">
                <configVersion>2</configVersion>
                <userRemoteConfigs>
                  <hudson.plugins.git.UserRemoteConfig>
                    <url>/repo</url>
                  </hudson.plugins.git.UserRemoteConfig>
                </userRemoteConfigs>
                <branches>
                  <hudson.plugins.git.BranchSpec>
                    <name>*/main</name>
                  </hudson.plugins.git.BranchSpec>
                </branches>
                <doGenerateSubmoduleConfigurations>false</doGenerateSubmoduleConfigurations>
                <submoduleCfg class="empty-list"/>
                <extensions/>
              </scm>
              <scriptPath>Jenkinsfile</scriptPath>
              <!-- "Lightweight" checkout reads just the Jenkinsfile via an
                   embedded JGit call before allocating a node; that path hit
                   a JGit NullPointerException against this local file://
                   repo. A full checkout (which we already confirmed the
                   system git CLI can do against /repo) sidesteps it. -->
              <lightweight>false</lightweight>
            </definition>
            <triggers/>
            <disabled>false</disabled>
          </flow-definition>
          EOF

          HTTP_CODE=$(curl -s -b cookies.txt -o response.txt -w '%{http_code}' -X POST \
            "${JENKINS_URL}/createItem?name=${JENKINS_JOB}" \
            -H "${CRUMB_FIELD}: ${CRUMB_VALUE}" \
            -H "Content-Type: application/xml" \
            --data-binary @job-config.xml)
          echo "HTTP ${HTTP_CODE}"
          cat response.txt
          [ "$HTTP_CODE" -lt 400 ]

      - name: Trigger a build and wait for it to finish
        run: |
          CRUMB_JSON=$(curl -sf -c cookies.txt "${JENKINS_URL}/crumbIssuer/api/json")
          CRUMB_FIELD=$(echo "$CRUMB_JSON" | jq -r '.crumbRequestField')
          CRUMB_VALUE=$(echo "$CRUMB_JSON" | jq -r '.crumb')

          BUILD_HEADERS=$(curl -s -b cookies.txt -D - -o /dev/null -X POST \
            "${JENKINS_URL}/job/${JENKINS_JOB}/build" \
            -H "${CRUMB_FIELD}: ${CRUMB_VALUE}")
          echo "$BUILD_HEADERS"
          QUEUE_URL=$(echo "$BUILD_HEADERS" | grep -i '^Location:' | awk '{print $2}' | tr -d '\r')
          if [ -z "$QUEUE_URL" ]; then
            echo "No queue Location header - build trigger request failed"; exit 1
          fi
          echo "Queued at: ${QUEUE_URL}"

          echo "Waiting for the build to leave the queue..."
          BUILD_NUMBER=""
          for i in $(seq 1 60); do
            QUEUE_JSON=$(curl -sf "${QUEUE_URL}api/json" || true)
            BUILD_NUMBER=$(echo "$QUEUE_JSON" | jq -r '.executable.number // empty')
            if [ -n "$BUILD_NUMBER" ]; then break; fi
            sleep 3
          done
          if [ -z "$BUILD_NUMBER" ]; then
            echo "Build never left the queue"; exit 1
          fi
          echo "Running as build #${BUILD_NUMBER}"

          echo "Waiting for the build to finish..."
          RESULT=""
          for i in $(seq 1 120); do
            BUILD_JSON=$(curl -sf "${JENKINS_URL}/job/${JENKINS_JOB}/${BUILD_NUMBER}/api/json" || true)
            RESULT=$(echo "$BUILD_JSON" | jq -r '.result // empty')
            if [ -n "$RESULT" ]; then break; fi
            sleep 5
          done

          echo "=== Console output ==="
          curl -sf "${JENKINS_URL}/job/${JENKINS_JOB}/${BUILD_NUMBER}/consoleText" || true
          echo "======================="
          echo "Build result: ${RESULT:-UNKNOWN}"

          [ "$RESULT" = "SUCCESS" ]

      - name: Dump Jenkins container logs on failure
        if: failure()
        run: docker logs jenkins --tail 300

      - name: Copy the pipeline's own build output out of the Jenkins container
        if: always()
        run: |
          mkdir -p jenkins-run-output
          docker cp \
            "jenkins:/var/jenkins_home/workspace/${JENKINS_JOB}/sample-app/target" \
            jenkins-run-output/target || echo "Nothing to copy (job may not have reached Package)"

      - name: Upload build output produced by the real Jenkins run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jenkins-run-output
          path: jenkins-run-output/
          if-no-files-found: ignore
          retention-days: 14

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  JFR_IMAGE: ghcr.io/jenkinsci/jenkinsfile-runner:jre-21-alpine
  # Jenkins core version baked into the jenkinsfile-runner image above
  # (jenkins.version in jenkinsci/jenkinsfile-runner's own pom.xml), used so
  # the Plugin Installation Manager Tool resolves plugin versions that are
  # actually compatible with that core instead of guessing "latest".
  JENKINS_CORE_VERSION: 2.555.3

jobs:
  build-and-test:
    name: Build & test sample-app (Maven)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: sample-app/pom.xml

      - name: mvn verify (compile, unit tests, checkstyle, package)
        working-directory: sample-app
        run: |
          ./mvnw -B -ntp clean verify checkstyle:check

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: sample-app/target/surefire-reports/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload built jar
        uses: actions/upload-artifact@v4
        with:
          name: sample-app-jar
          path: sample-app/target/sample-app.jar
          if-no-files-found: error
          retention-days: 14

  verify-jenkinsfile:
    name: Verify Jenkinsfile with jenkinsfile-runner
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pull jenkinsfile-runner image
        run: docker pull "${JFR_IMAGE}"

      - name: Run the Jenkinsfile headlessly against this repo
        run: |
          # The image's default entrypoint (jenkinsfile-runner-launcher)
          # already hardcodes --plugins /usr/share/jenkins/ref/plugins, so
          # passing -p a second time as an extra CLI arg is rejected
          # ("option '--plugins' should be specified only once"). Instead,
          # resolve our extra plugins (plugins.txt) straight into that same
          # ref directory with the Plugin Installation Manager Tool already
          # bundled in the image, merging with - not replacing - the plugins
          # the "vanilla" jenkinsfile-runner image ships with, then hand off
          # to the normal entrypoint.
          docker run --rm \
            -v "${GITHUB_WORKSPACE}":/workspace \
            -v "${GITHUB_WORKSPACE}":/build \
            --entrypoint sh \
            "${JFR_IMAGE}" \
            -c "
              java -jar /app/bin/jenkins-plugin-manager.jar \
                --jenkins-version ${JENKINS_CORE_VERSION} \
                --plugin-file /workspace/plugins.txt \
                --plugin-download-directory /usr/share/jenkins/ref/plugins \
              && exec /app/bin/jenkinsfile-runner-launcher
            "

      - name: Upload sample-app build artifacts produced by the pipeline run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jenkinsfile-runner-workspace
          path: |
            sample-app/target/surefire-reports/
            sample-app/target/reports/
            sample-app/target/*.jar
          if-no-files-found: ignore
          retention-days: 14
